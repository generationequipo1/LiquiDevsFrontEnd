<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/nav.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/catalogo.css">
  <link rel="stylesheet" href="../css/cart.css">
</head>

<body>

<header>
  <div id="navbar-placeholder"></div>
</header>

<div id="carrito-placeholder"></div>
<div id="sparkles-container"></div>

<main>

<section class="hero-banner sprinkles-hero">
  <img src="../assets/emociones/feliz-helado1.png" class="hero-img">
  <div class="hero-blob blob-1"></div>
  <div class="hero-blob blob-2"></div>

  <div class="hero-content">
    <span class="hero-badge">Desde siempre, hechos con amor</span>

    <h1 class="lema-banner">
      Helados<br>
      <span>que saben a felicidad</span>
    </h1>

    <p class="hero-desc">
      Sabores clásicos de toda la vida<br>
      y algunos artesanales para sorprender 🍦
    </p>

    <div class="hero-actions">
      <a href="#container-cards-fijas" class="btn-hero-primary">Ver sabores</a>
      <a href="#container-cards-fijas" id="btn-favoritos" class="btn-hero-secondary">Nuestros favoritos ⭐</a>
    </div>
  </div>
</section>

<section class="toolbar-catalogo">
  <span id="contador-resultados" class="contador-resultados"></span>
  <button id="btn-mostrar-todos" class="btn btn-outline-secondary d-none">Mostrar todos</button>

  <input type="search" id="input-busqueda" placeholder="Buscar helado 🍨">

  <select id="filtro-tipo">
    <option value="todos">Tipo</option>
    <option value="cono">Cono</option>
    <option value="vaso">Vaso</option>
  </select>

  <select id="filtro-sabor">
    <option value="todos">Sabor</option>
    <option value="vainilla">Vainilla</option>
    <option value="chocolate">Chocolate</option>
    <option value="fresa">Fresa</option>
    <option value="limon">Limón</option>
  </select>

  <select id="filtro-mixto">
    <option value="todos">¿Mixto?</option>
    <option value="si">Sí</option>
    <option value="no">No</option>
  </select>

  <select id="filtro-emocion">
    <option value="todos">¿Cómo te sientes?</option>
    <option value="feliz">Feliz 😄</option>
    <option value="relajado">Relajado 😌</option>
    <option value="intenso">Intenso 🍫</option>
    <option value="refrescante">Refrescante 🍋</option>
  </select>

  <select id="orden-precio">
    <option value="">Precio</option>
    <option value="menor">Menor a Mayor</option>
    <option value="mayor">Mayor a Menor</option>
  </select>
</section>

<section id="container-cards-fijas" class="grid-catalogo"></section>

</main>

<div id="footer"></div>

<script src="../js/productos.js"></script>
<script src="../js/catalogosll.js"></script>
<script src="../js/cart.js"></script>
<script src="../componentes/navbarinclude.js"></script>
<script src="../componentes/cartinclude.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../componentes/cargarfooter.js"></script>

</body>
</html>
