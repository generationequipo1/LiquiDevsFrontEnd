<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../CSS/nav.css">
  <link rel="stylesheet" href="../CSS/style.css">
  <link rel="stylesheet" href="../CSS/catalogo.css">
  <link rel="stylesheet" href="../CSS/cart.css">
</head>

<body>

  <header>
    <div id="navbar-placeholder"></div>
  </header>

  <div id="carrito-placeholder"></div>

  <main>

    <section class="hero-banner sprinkles-hero">
      <h1 class="lema-banner">Helados con código de sabor</h1>
      <p class="hero-desc">Elige tu sabor según tu estado de ánimo 🍦</p>
    </section>

    <section class="toolbar-catalogo">
      <input type="search" id="input-busqueda" placeholder="Buscar helado..." autocomplete="off" />

      <select id="filtro-sabor">
        <option value="todos">Todos los sabores</option>
      </select>

      <select id="orden-precio">
        <option value="">Ordenar por precio</option>
        <option value="menor">Menor a Mayor</option>
        <option value="mayor">Mayor a Menor</option>
      </select>
    </section>

    <main id="container-cards-fijas"></main>

    <div id="footer"></div>

    <script src="/JS/cart.js"></script>
    <script src="/Componentes/navbarInclude.js"></script>
    <script src="../Componentes/cartinclude.js"></script>
    <script src="/JS/productos.js"></script>
    <script src="/JS/carrusel.js"></script>
    <script src="/JS/catalogoSLL.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../Componentes/cargarfooter.js"></script>

</body>

</html>
