<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contáctanos</title>

 <!-- aqui va BOOTSTRAP -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <!-- NAVBAR CSS -->
  <link rel="stylesheet" href="/CSS/nav.css">

  <!-- Estilos generales del sitio -->
  <link rel="stylesheet" href="../CSS/style.css">
  <!-- aqui va solo el link que va utilizar para esta pagina -->

  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">

  <title>Sobre Nosotros</title>
</head>

<body>
    <header>
        <div id="navbar-placeholder"></div>
    </header>

    <section class="seccion-contacto">
        <div class="contacto-form">
            <h2>Contáctanos</h2>

            <form id="form-contacto" action="https://formspree.io/f/xdkvbrra" method="POST">
                <input type="email" name="email" placeholder="Correo electrónico" required>
                <input type="text" name="nombre" placeholder="Nombre completo" required>
                <input type="tel" name="telefono" placeholder="Teléfono" required>
                <textarea name="mensaje" placeholder="Mensaje" required></textarea>
                <button type="submit" id="btn-enviar">Enviar mensaje</button>
            </form>

            <a href="https://wa.me/573174070511" class="btn-whatsapp" target="_blank">Escríbenos por WhatsApp</a>
        </div>

        <!-- Imagen -->
        <div class="contacto-imagen">
            <img src="../Assets/helado.jpeg" alt="Postres" class="img-contacto">
            <p class="direccion">
                📍 Calle Byte #1234 <br>
                Bogotá, Colombia
            </p>

        </div>

    </section>

    <section class="FAQs">
        <button type="button" class="btn-faq-toggle" id="btn-toggle">Preguntas Frecuentes</button>
        <div class="faq-box" id="faq-div">
            <h2>Preguntas Frecuentes</h2>

            <div class="faq-item">
                <button type="button" class="faq-question">¿Cuánto tarda el envío?</button>
                <div class="faq-answer">
                    <p>Entre 2 y 5 días hábiles dependiendo de tu ciudad.</p>
                </div>
            </div>

            <div class="faq-item">
                <button type="button" class="faq-question">¿Cuál es el costo del envío?</button>
                <div class="faq-answer">
                    <p>El sistema calcula el valor automáticamente al finalizar la compra.</p>
                </div>
            </div>

            <div class="faq-item">
                <button type="button" class="faq-question">¿Puedo hacer seguimiento a mi pedido?</button>
                <div class="faq-answer">
                    <p>Sí, recibirás tu número de guía por correo.</p>
                </div>
            </div>
        </div>


    </section>



    <div id="footer"></div>

    <script src="../JS/acerca_de_nosotros.js"></script>
    <script src="/Componentes/navbarInclude.js"></script>
    <script src="../Componentes/cargarfooter.js"></script>
</body>

</html>
