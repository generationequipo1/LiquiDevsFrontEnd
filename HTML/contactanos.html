<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contáctanos</title>
 <!-- aqui va BOOTSTRAP -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <!-- NAVBAR CSS -->
  <link rel="stylesheet" href="/CSS/nav.css">

  <!-- Estilos generales del sitio -->
  <link rel="stylesheet" href="../CSS/style.css">
  <!-- aqui va solo el link que va utilizar para esta pagina -->

  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
  
</head>

<body>

<header>
  <div id="navbar-placeholder"></div>
</header>

<!-- ===== HERO DUDAS ===== -->
<section class="hero-dudas">
  <img src="../Assets/preguntas-helado.png" alt="Dudas">
  <p>¿Tienes dudas?</p>
</section>

<!-- ===== SECCIÓN CONTACTO ===== -->
<section class="contacto-wrapper">

  <!-- CARD FORM -->
  <div class="card-contacto">

    <h2>Contáctanos</h2>

    <form id="form-contacto" action="https://formspree.io/f/xdkvbrra" method="POST">
      <input type="email" name="email" placeholder="Correo electrónico" required>
      <input type="text" name="nombre" placeholder="Nombre completo" required>
      <input type="tel" name="telefono" placeholder="Teléfono" required>
      <textarea name="mensaje" placeholder="Mensaje" required></textarea>

      <div class="btn-group">
        <button type="submit" class="btn-enviar">Enviar mensaje</button>
        <a href="https://wa.me/573174070511" target="_blank" class="btn-whatsapp">
          Escríbenos por WhatsApp
        </a>
      </div>
    </form>

    <!-- CTA FAQ -->
    <div class="faq-cta">
      <img src="../Assets/preguntas-frecuentes-helado.png" alt="FAQ">
      <button id="btn-faq" class="btn-faq-toggle">
        Preguntas Frecuentes
      </button>
    </div>

  </div>

  <!-- CARD IMAGEN -->
  <div class="card-contacto card-imagen">
    <img src="../Assets/contactanos-helado.png" alt="Contáctanos">
    <p class="direccion">
      Calle Byte #1234<br>
      Bogotá, Colombia<br>
      3006789056
    </p>
  </div>

</section>

<!-- ===== FAQ ===== -->
<section id="faq-box" class="faq-box">
  <h3>Preguntas Frecuentes</h3>

  <div class="faq-item">
    <button class="faq-question">¿Cuánto tarda el envío?</button>
    <div class="faq-answer">Entre 2 y 5 días hábiles.</div>
  </div>

  <div class="faq-item">
    <button class="faq-question">¿Cuál es el costo del envío?</button>
    <div class="faq-answer">Se calcula automáticamente al finalizar la compra.</div>
  </div>

  <div class="faq-item">
    <button class="faq-question">¿Puedo hacer seguimiento a mi pedido?</button>
    <div class="faq-answer">Sí, recibirás el número de guía por correo.</div>
  </div>
</section>

<!-- FOOTER -->
<div id="footer"></div>

<!-- JS -->
    <script src="../JS/acerca_de_nosotros.js"></script>
    <script src="/Componentes/navbarInclude.js"></script>
    <script src="../Componentes/cargarfooter.js"></script>
    <script src="/JS/contactanos.js"></script>

</body>
</html>
